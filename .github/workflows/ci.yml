name: DevSecOps CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: app
        run: pytest -v app/tests

  build-and-scan:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t gitops-devsecops-app:${{ github.sha }} \
            .

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: latest

      - name: Scan OS and library vulnerabilities
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-report.json \
            --exit-code 1 \
            gitops-devsecops-app:${{ github.sha }}

      - name: Display vulnerability summary
        if: always()
        run: |
          if [ -f trivy-report.json ]; then
            python -c 'import json; from collections import Counter; r=json.load(open("trivy-report.json", encoding="utf-8")); c=Counter(v.get("Severity", "UNKNOWN") for x in r.get("Results", []) for v in (x.get("Vulnerabilities") or [])); print("Trivy vulnerability summary:"); [print(f"{s}: {c[s]}") for s in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN")]'
          else
            echo 'Trivy report was not generated.'
          fi

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 14

  push-to-ecr:
    name: Push Docker Image to AWS ECR
    runs-on: ubuntu-latest
    needs: build-and-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::444166849721:role/GitOpsDevSecOpsGitHubActionsRole
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: gitops-devsecops-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f docker/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
