apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-devsecops-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rahul-chaudhari-collab/multi-env-gitops-devsecops.git
    targetRevision: main
    path: kubernetes/base
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
